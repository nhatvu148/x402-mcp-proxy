# The example server is a workspace member so `cargo run -p coinflip-server`
# works from the repo root and both crates share one target dir and lockfile.
[workspace]
members = [".", "examples/coinflip-server"]

[package]
name = "x402-mcp-proxy"
version = "0.1.4"
edition = "2024"
description = "stdio MCP proxy that pays x402-gated MCP servers with USDC on Solana, so an agent can buy a tool call without holding a wallet"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nhatvu148/x402-mcp-proxy"
homepage = "https://github.com/nhatvu148/x402-mcp-proxy"
readme = "README.md"
keywords = ["mcp", "x402", "solana", "usdc", "agent"]
categories = ["command-line-utilities", "web-programming"]
# The example server is its own workspace member and is not part of this
# package; keep the published tarball to the proxy itself.
exclude = ["examples/"]

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.6", features = ["derive", "env"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
reqwest-middleware = "0.5.2"
serde_json = "1.0.151"
solana-client = "3.1.4"
solana-keypair = "3.1.2"
solana-signer = "3.0.1"
tokio = { version = "1.53.1", features = ["full"] }
x402-chain-solana = { version = "2.0.2", features = ["client"] }
x402-reqwest = "2.0.2"
x402-types = "2.0.2"
