# The example server is a workspace member so `cargo run -p coinflip-server`
# works from the repo root and both crates share one target dir and lockfile.
[workspace]
members = [".", "examples/coinflip-server"]

[package]
name = "x402-mcp-proxy"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.6", features = ["derive", "env"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
reqwest-middleware = "0.5.2"
serde_json = "1.0.151"
solana-client = "3.1.4"
solana-keypair = "3.1.2"
solana-signer = "3.0.1"
tokio = { version = "1.53.1", features = ["full"] }
x402-chain-solana = { version = "2.0.2", features = ["client"] }
x402-reqwest = "2.0.2"
x402-types = "2.0.2"
